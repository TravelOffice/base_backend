LAMBDA_LAYERS = {
  "ecs-service" = {
    path = "src/layers/ecs-service"
  },
  "user-service" = {
    path = "src/layers/user-service"
  },
  "post_tenant_provision" = {
    path = "src/layers/post_tenant_provision"
  }
}


# LAMBDA_FUNCTIONS
# Name	        | Type	       |  Default               |Required
# path          | string       |                        |  Yes
# layers        | list(string) |                        |  Yes
# handler       | string       |  index.handler         |  No
# memory_size   | number       |  128                   |  No
# runtime       | string       |  nodejs14.x            |  No
# timeout       | number       |  3                     |  No
# architecture  | string       |  arm64                 |  No
# log_retention | number       |  7                     |  No
# permission    | string       |                        |  Yes

#The refer custom policies: https://raw.githubusercontent.com/TravelOffice/terraform_policy_database/master/custom_policy.json
LAMBDA_FUNCTIONS = {
  "lambda_ecs_service" = {
    path        = "src/modules/ecs-service/dist",
    memory_size = 128
    handler     = "lambda.handler"
    runtime     = "nodejs14.x"
    layers      = ["ecs-service"]
    permission = {
      custom_policies = [
        "LambdaStandardRole",
        "SecretManagerRead",
        "LambdaExecuteEcsTask"
      ]
      aws_policies    = []
    },
    env_vars    = "ecs_task_vars"
  },
  "lambda_user_service" = {
    path        = "src/modules/user-service/dist",
    memory_size = 128
    handler     = "lambda.handler"
    runtime     = "nodejs14.x"
    layers      = ["user-service"]
    permission = {
      custom_policies = [
        "LambdaStandardRole",
        "SecretManagerRead",
        "DynamoTableReadWrite"
      ]
      aws_policies    = []
    },
    env_vars    = "standard_vars"
    timeout     = 15
  },
  "lambda_post_tenant_provision" = {
    path        = "src/modules/post_tenant_provision/dist",
    memory_size = 128
    handler     = "lambda.handler"
    runtime     = "nodejs14.x"
    layers      = ["post_tenant_provision"]
    permission = {
      custom_policies = [
        "LambdaStandardRole",
        "SecretManagerRead",
        "DynamoTableReadWrite",
        "SESSendMail"
      ]
      aws_policies    = []
    },
    env_vars    = "standard_vars"
  },
}

API_ENDPOINTS = {
  "/users" = {
    "POST" = {
      lambda_name = "lambda_user_service"
      authorization = false
    }
  }
}

LAMBDA_TRIGGERS = {
  "PreSignUp" = {
    lambda_name = "lambda_ecs_service"
  }
}

